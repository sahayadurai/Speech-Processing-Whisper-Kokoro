<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px 12px 0 0;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 12px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
            min-width: 150px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            white-space: nowrap;
        }

        select {
            padding: 6px 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 12px;
            background: white;
            cursor: pointer;
            flex: 1;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-radius: 8px 2px 8px 8px;
        }

        .message.bot .message-bubble {
            background: #e9ecef;
            color: #212529;
            border-radius: 2px 8px 8px 8px;
        }

        .message-time {
            font-size: 11px;
            color: #adb5bd;
        }

        .audio-player {
            font-size: 12px;
            max-width: 250px;
        }

        .audio-player audio {
            width: 100%;
            height: 24px;
            margin-top: 4px;
        }

        .placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .footer {
            padding: 16px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .record-btn {
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .record-btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .record-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .record-btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }

        .record-btn.recording {
            background: #dc3545;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(220, 53, 69, 0);
            }
        }

        .new-chat-btn {
            background: #28a745;
            color: white;
            width: 100%;
        }

        .new-chat-btn:hover {
            background: #218838;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .status {
            font-size: 12px;
            color: #6c757d;
            text-align: center;
            min-height: 18px;
        }

        .status.processing {
            color: #667eea;
            font-weight: 600;
        }

        .status.error {
            color: #dc3545;
        }

        /* Spacebar hint */
        .spacebar-hint {
            font-size: 11px;
            color: #adb5bd;
            text-align: center;
            margin-top: 4px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .control-group {
                min-width: 100%;
            }

            .message-bubble {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Voice Chatbot</h1>
            <p>Hold spacebar or click to record</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="user-lang">Listen:</label>
                <select id="user-lang">
                    <option value="en">English</option>
                    <option value="it">Italian</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>
            <div class="control-group">
                <label for="bot-lang">Reply:</label>
                <select id="bot-lang">
                    <option value="en">English</option>
                    <option value="it">Italian</option>
                    <option value="fr">French</option>
                </select>
            </div>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="placeholder">Start a conversation</div>
        </div>

        <div class="footer">
            <div class="button-group">
                <button class="record-btn" id="record-btn">
                    <span id="record-icon">🎤</span>
                    <span id="record-text">Record</span>
                </button>
            </div>
            <div class="status" id="status"></div>
            <div class="spacebar-hint">💡 Tip: Hold SPACE or click to record</div>
            <button class="new-chat-btn" id="new-chat-btn">New Chat</button>
        </div>
    </div>

    <script>
        const recordBtn = document.getElementById('record-btn');
        const recordIcon = document.getElementById('record-icon');
        const recordText = document.getElementById('record-text');
        const chatContainer = document.getElementById('chat-container');
        const status = document.getElementById('status');
        const userLangSelect = document.getElementById('user-lang');
        const botLangSelect = document.getElementById('bot-lang');
        const newChatBtn = document.getElementById('new-chat-btn');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Initialize UI
        async function init() {
            await loadHistory();
        }

        // Load chat history
        async function loadHistory() {
            try {
                const response = await fetch('/history');
                const messages = await response.json();

                if (messages.length === 0) {
                    chatContainer.innerHTML = '<div class="placeholder">Start a conversation</div>';
                    return;
                }

                chatContainer.innerHTML = '';
                messages.forEach(msg => addMessageToUI(msg));
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // Add message to UI
        function addMessageToUI(entry) {
            if (chatContainer.querySelector('.placeholder')) {
                chatContainer.innerHTML = '';
            }

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `
                <div class="message-bubble">${escapeHtml(entry.user)}</div>
                <div class="message-time">${entry.timestamp}</div>
            `;
            chatContainer.appendChild(userMsg);

            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.innerHTML = `
                <div class="message-bubble">${escapeHtml(entry.bot)}</div>
                <div class="audio-player">
                    <audio controls><source src="${entry.audio_url}" type="audio/wav"></audio>
                </div>
                <div class="message-time">${entry.timestamp}</div>
            `;
            chatContainer.appendChild(botMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Start recording
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudio(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
                recordIcon.textContent = '⏹';
                recordText.textContent = 'Recording...';
                status.textContent = '';
            } catch (error) {
                status.textContent = '❌ Microphone error: ' + error.message;
                status.className = 'status error';
            }
        }

        // Stop recording
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordIcon.textContent = '⏳';
                recordText.textContent = 'Processing...';
                recordBtn.disabled = true;
                status.textContent = '';
            }
        }

        // Send audio to server
        async function sendAudio(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'audio.webm');
                formData.append('user_lang', userLangSelect.value);
                formData.append('bot_lang', botLangSelect.value);
                
                console.log(`[CLIENT] Sending request:`, {
                    user_lang: userLangSelect.value,
                    bot_lang: botLangSelect.value
                });

                status.textContent = '🔄 Processing...';
                status.className = 'status processing';

                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Upload failed');
                }

                const entry = await response.json();
                addMessageToUI(entry);

                status.textContent = '✓ Done';
                status.className = 'status';
                setTimeout(() => { status.textContent = ''; }, 2000);
            } catch (error) {
                status.textContent = '❌ ' + error.message;
                status.className = 'status error';
            } finally {
                recordBtn.disabled = false;
                recordBtn.classList.remove('recording');
                recordIcon.textContent = '🎤';
                recordText.textContent = 'Record';
            }
        }

        // Button event listeners
        recordBtn.addEventListener('pointerdown', () => {
            if (!isRecording && !recordBtn.disabled) {
                startRecording();
            }
        });

        recordBtn.addEventListener('pointerup', () => {
            if (isRecording) {
                stopRecording();
            }
        });

        recordBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!isRecording && !recordBtn.disabled) {
                startRecording();
            }
        });

        recordBtn.addEventListener('touchend', e => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });

        // Spacebar support
        document.addEventListener('keydown', e => {
            if (e.code === 'Space' && !isRecording && !recordBtn.disabled) {
                const activeElement = document.activeElement;
                if (!['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(activeElement.tagName)) {
                    e.preventDefault();
                    startRecording();
                }
            }
        });

        document.addEventListener('keyup', e => {
            if (e.code === 'Space' && isRecording) {
                e.preventDefault();
                stopRecording();
            }
        });

        // New chat button
        newChatBtn.addEventListener('click', async () => {
            try {
                await fetch('/new_chat', { method: 'POST' });
                chatContainer.innerHTML = '<div class="placeholder">Start a conversation</div>';
                status.textContent = '🔄 Chat cleared';
                status.className = 'status processing';
                setTimeout(() => { status.textContent = ''; }, 1500);
            } catch (error) {
                status.textContent = '❌ Error clearing chat';
                status.className = 'status error';
            }
        });

        // Initialize
        init();
    </script>
</body>
</html>
